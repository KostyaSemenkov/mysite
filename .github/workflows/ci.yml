name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Сайт — тесты Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # тесты ходят в статические файлы через манифест WhiteNoise
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test

  boards-backend:
    name: Доски — тесты бэкенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boardapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: boardapp/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  boards-frontend:
    name: Доски — сборка фронтенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boardapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boardapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Образы в GHCR
    # образы публикуются только с main и только после зелёных тестов
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [site, boards-backend, boards-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
          - name: boards
            context: ./boardapp
            file: ./boardapp/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }}
