services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysite}
      POSTGRES_USER: ${POSTGRES_USER:-mysite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mysite}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: 0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-lemurqa.ru,www.lemurqa.ru}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mysite}
      BOARDS_SSO_SECRET: ${BOARDS_SSO_SECRET:-}
      PORT: "8000"
    volumes:
      - media:/app/media

  boards:
    build: ./boardapp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mysite}:${POSTGRES_PASSWORD}@db:5432/boards
      JWT_SECRET: ${BOARDS_JWT_SECRET:?set BOARDS_JWT_SECRET in .env}
      SSO_SECRET: ${BOARDS_SSO_SECRET:?set BOARDS_SSO_SECRET in .env}
      CORS_ORIGINS: ${BOARDS_CORS_ORIGINS:-https://lemurqa.ru}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-lemurqa.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

  umami:
    image: umamisoftware/umami:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysite}:${POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-umami}
      PORT: "3000"
    ports:
      - "127.0.0.1:3200:3000"
    labels:
      - "описание=аналитика; наружу не опубликована, ждёт поддомен"

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
