{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">{% if page.has_previous %}<a href="?q={{ q|urlencode }}&topic={{ topic|urlencode }}&level={{ request.GET.level|urlencode }}&direction={{ request.GET.direction|urlencode }}&price={{ request.GET.price|urlencode }}&page={{ page.previous_page_number }}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ q|urlencode }}&topic={{ topic|urlencode }}&level={{ request.GET.level|urlencode }}&direction={{ request.GET.direction|urlencode }}&price={{ request.GET.price|urlencode }}&page={{ page.next_page_number }}">Далее →</a>{% endif %}</nav>{% endif %}
