<article class="course-card"><div class="meta"><span>{{ item.provider }}</span><span>↗</span></div><span class="pill">{{ item.get_level_display }}</span><h3><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></h3><p>{{ item.summary|truncatechars:110 }}</p><div class="course-bottom"><span>{{ item.duration }}</span><strong>{% if item.price %}{{ item.price }} ₽{% else %}Бесплатно{% endif %}</strong></div>{% if item.demo %}<small class="demo-label">Пример курса</small>{% endif %}</article>
