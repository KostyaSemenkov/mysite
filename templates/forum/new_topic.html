{% extends 'base.html' %}
{% block title %}Новая тема — Форум{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-white">Новая тема</h1>
<form method="post" class="mt-6 max-w-2xl space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-5">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="rounded-lg bg-indigo-600 px-4 py-2 text-sm text-white hover:bg-indigo-500">Создать</button>
</form>
{% endblock %}
