{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-white">Вход</h1>
<form method="post" class="mt-6 max-w-md space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-5">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="rounded-lg bg-indigo-600 px-4 py-2 text-sm text-white hover:bg-indigo-500">Войти</button>
  <p class="pt-2 text-xs text-slate-500">Нет аккаунта?
    <a href="{% url 'register' %}" class="text-indigo-400 hover:text-indigo-300">Зарегистрироваться</a></p>
</form>
{% endblock %}
