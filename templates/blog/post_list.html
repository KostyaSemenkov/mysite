{% extends 'base.html' %}
{% block title %}Блог — {{ profile.name|default:'' }}{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-white">Блог</h1>
<div id="posts-list" class="mt-8 space-y-6" data-next="{% if page_obj.has_next %}{{ page_obj.next_page_number }}{% endif %}">
  {% include 'blog/includes/posts_page.html' %}
</div>
{% if page_obj.has_next %}
  <button id="load-more"
          class="mt-6 rounded-lg border border-slate-700 px-5 py-2.5 text-sm hover:border-slate-500"
          onclick="loadMore(this)">Показать ещё</button>
  <span id="posts-loading" class="ml-3 hidden text-sm text-slate-500">Загружаем…</span>
{% endif %}
<script>
async function loadMore(btn) {
  const list = document.getElementById('posts-list');
  const page = list.dataset.next;
  if (!page) { btn.remove(); return; }
  btn.disabled = true;
  document.getElementById('posts-loading').classList.remove('hidden');
  try {
    const resp = await fetch(`?page=${page}`, { headers: { 'X-Load-More': '1' } });
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('.post-card').forEach(el => list.appendChild(el));
    list.dataset.next = doc.querySelector('#posts-list')?.dataset.next || '';
    if (!list.dataset.next) btn.remove();
  } catch (e) { console.error(e); }
  btn.disabled = false;
  document.getElementById('posts-loading').classList.add('hidden');
}
</script>
{% endblock %}
