{% for post in page_obj %}
  <article class="post-card card-warm p-6">
    <div class="flex items-center gap-2 text-xs text-slate-500">
      <time>{{ post.created_at|date:'d.m.Y' }}</time>
      <span>·</span>
      <span>{{ post.reading_minutes }} мин чтения</span>
    </div>
    <h2 class="mt-1 text-xl font-semibold">
      <a href="{{ post.get_absolute_url }}" class="text-white hover:text-indigo-300">{{ post.title }}</a>
    </h2>
    {% if post.excerpt %}<p class="mt-2 text-slate-400">{{ post.excerpt }}</p>{% endif %}
    {% if post.tags %}
      <div class="mt-3 flex flex-wrap gap-2">
        {% for tag in post.tag_list %}
          <span class="rounded-full bg-indigo-950 px-2.5 py-0.5 text-xs text-indigo-300">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </article>
{% endfor %}
