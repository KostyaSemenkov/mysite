{% extends 'base.html' %}
{% block title %}404 — страница не найдена{% endblock %}

{% block content %}
<div class="text-center py-16">
  <div class="font-display text-7xl font-bold text-indigo-400">404</div>
  <h1 class="mt-4 text-2xl font-semibold text-white">Такой страницы нет</h1>
  <p class="mt-3 text-slate-400">Возможно, её съел лемур. Или ссылка устарела.</p>
  <div class="mt-8 flex justify-center gap-4">
    <a href="/" class="btn-warm">На главную</a>
    <a href="{% url 'search' %}" class="btn-warm ghost">Поиск по сайту</a>
  </div>
</div>
{% endblock %}
