{% comment %}
Ссылки разделов меню — общий список для шапки и мобильного меню.
cls прячет пункт на узких экранах; с mobile=1 показываем всё.
{% endcomment %}{% for item in nav_items %}{% spaceless %}
  <a href="{{ item.url }}" class="hover:text-white{% if not mobile and item.cls %} {{ item.cls }}{% endif %}{% if nav_section == item.section %} text-white font-semibold{% endif %}"{% if nav_section == item.section %} aria-current="page"{% endif %}>{{ item.label }}</a>
{% endspaceless %}{% endfor %}
