{% load static %}
{# Звёздочка «в избранное». Переменная: obj #}
{% load site_extras %}
{% if user.is_authenticated %}
  <form method="post" action="{% url 'favorite_toggle' %}" class="inline align-middle">
    {% csrf_token %}
    <input type="hidden" name="ct" value="{% content_type_id obj %}">
    <input type="hidden" name="oid" value="{{ obj.pk }}">
    <button type="submit" aria-pressed="{% if is_favorite %}true{% else %}false{% endif %}"
            aria-label="{% if is_favorite %}Убрать из избранного{% else %}Добавить в избранное{% endif %}"
            title="{% if is_favorite %}Убрать из избранного{% else %}В избранное{% endif %}"
            class="align-middle" style="color: {% if is_favorite %}var(--accent-light){% else %}var(--border2){% endif %}">
      <svg class="icon" style="width:1.1em;height:1.1em;{% if is_favorite %}fill:currentColor{% endif %}" aria-hidden="true">
        <use href="{% static 'img/icons.svg' %}#star"/></svg>
    </button>
  </form>
{% else %}
  <a href="{% url 'login' %}" title="Войдите, чтобы добавлять в избранное"
     aria-label="Войдите, чтобы добавлять в избранное" class="align-middle" style="color:var(--border2)">
    <svg class="icon" style="width:1.1em;height:1.1em" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#star"/></svg>
  </a>
{% endif %}
