{% extends 'base.html' %}
{% block title %}Связаться — {{ profile.name|default:'' }}{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-white">Связаться со мной</h1>
<p class="mt-2 text-slate-400">Расскажите о задаче — отвечу в течение пары дней.</p>
<form action="{% url 'contacts:contact_submit' %}" method="post"
      class="card-warm mt-8 max-w-lg space-y-4 p-6">
  {% csrf_token %}
  <input type="text" name="name" required placeholder="Ваше имя"
         class="input">
  <input type="email" name="email" required placeholder="Email"
         class="input">
  <textarea name="message" required rows="5" placeholder="Сообщение"
            class="input"></textarea>
  <button class="btn-warm">Отправить</button>
</form>
{% endblock %}
