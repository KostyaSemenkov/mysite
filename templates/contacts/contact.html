{% extends 'base.html' %}
{% block title %}Связаться — {{ profile.name|default:'' }}{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-white">Связаться со мной</h1>
<p class="mt-2 text-slate-400">Расскажите о задаче — отвечу в течение пары дней.</p>
<form action="{% url 'contacts:contact_submit' %}" method="post"
      class="card-warm mt-8 max-w-lg space-y-4 p-6">
  {% csrf_token %}
  <div>
    <label for="id_name" class="visually-hidden">Ваше имя</label>
    <input type="text" id="id_name" name="name" required placeholder="Ваше имя"
           autocomplete="name" class="input">
  </div>
  <div>
    <label for="id_email" class="visually-hidden">Email для ответа</label>
    <input type="email" id="id_email" name="email" required placeholder="Email"
           autocomplete="email" class="input">
  </div>
  <div>
    <label for="id_message" class="visually-hidden">Сообщение</label>
    <textarea id="id_message" name="message" required rows="5" placeholder="Сообщение"
              autocomplete="off" class="input"></textarea>
  </div>
  <button type="submit" class="btn-warm">Отправить</button>
</form>
{% endblock %}
